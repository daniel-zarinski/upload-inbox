# Mounts the Azure Files share at /upload-inbox. `az containerapp create` has no flag for this.
properties:
  template:
    containers:
      - name: upload-inbox
        image: ghcr.io/daniel-zarinski/upload-inbox-server:latest
        volumeMounts:
          - volumeName: inbox
            mountPath: /upload-inbox
    volumes:
      - name: inbox
        storageType: AzureFile
        storageName: inbox
